# Ready to run with the published Docker Hub image (no build required):
#   docker compose -f docker-compose.hub.yml up -d
# Panel: http://localhost:8080
#
# Console mode (daemon, no panel) instead of the panel: set MODE: console,
# uncomment the CLEAN_* variables below and remove the "ports" section.
#
# Windows / Docker Desktop: pass the socket as //var/run/docker.sock:/var/run/docker.sock

services:
  docker-cleaner:
    image: pbauer/docker-cleaner:latest
    container_name: docker-cleaner
    environment:
      MODE: web                        # web (panel) | console (daemon)

      # --- Panel login (optional) ---
      # WEB_AUTH_ENABLED: "true"
      # WEB_AUTH_USER: admin
      # WEB_AUTH_PASSWORD: change-me

      # --- Automatic cleanup (optional; in web mode you can also enable it in the panel) ---
      # AUTO_CLEAN: "true"             # required in console mode (on by default there)
      # Cleaning time: interval…
      # CLEAN_INTERVAL: 24h            # 30m | 24h | 7d | 90s
      # …or cron (takes precedence over the interval):
      # CLEAN_CRON: "0 3 * * *"        # daily at 03:00
      # TZ: Europe/Warsaw
      # What to clean:
      # CLEAN_SCOPE: all               # dangling | all
      # CLEAN_BUILD_CACHE: "true"      # also prune the build cache
      # MIN_AGE: 168h                  # only remove images older than this
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - cleaner-data:/data
    restart: unless-stopped

volumes:
  cleaner-data:
